<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Festival Vallenato{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'votaciones:inicio' %}">Festival Vallenato</a>
            <div class="ms-auto">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">Hola, {{ user.username }}</span>
                    <form class="d-inline" method="post" action="{% url 'votaciones:cerrar_sesion' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-light btn-sm me-2" href="{% url 'votaciones:iniciar_sesion' %}">Iniciar sesión</a>
                    <a class="btn btn-warning btn-sm" href="{% url 'votaciones:registro' %}">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container py-4">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
