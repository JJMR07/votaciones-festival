{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Festival Vallenato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/Styles.css' %}">
</head>
<body>
    <div class="login-container">
        <form class="login-form" method="post" novalidate>
            {% csrf_token %}
            <header class="login-header"><h1>Iniciar sesión</h1><p>Ingresa con tu cuenta para continuar.</p></header>
            {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
            <div class="login-fields">
                <label for="id_username">Nombre de usuario:</label>
                <input class="form-control" type="text" id="id_username" name="username" required autofocus>
                <label for="id_password">Contraseña:</label>
                <input class="form-control" type="password" id="id_password" name="password" required>
                <input type="submit" value="Entrar">
            </div>
            <div class="login-footer"><p>¿No tienes una cuenta? <a href="{% url 'votaciones:registro' %}">Crear una cuenta</a></p></div>
        </form>
    </div>
</body>
</html>
