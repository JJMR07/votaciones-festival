{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Festival Vallenato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/Styles.css' %}">
</head>
<body>
    <div class="register-container">
        <form class="register-form" method="post" novalidate>
            {% csrf_token %}
            <header class="register-header"><h1>Registro</h1><p>Ingresa tus datos para crear una cuenta.</p></header>
            <div class="register-fields">
                {% for field in form %}
                    <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
                    <input class="form-control" type="{{ field.field.widget.input_type }}" id="{{ field.id_for_label }}" name="{{ field.html_name }}" required>
                    {% for error in field.errors %}<p class="text-danger">{{ error }}</p>{% endfor %}
                {% endfor %}
                <input type="submit" value="Registrarse">
            </div>
            <div class="register-footer"><p>¿Ya tienes una cuenta? <a href="{% url 'votaciones:iniciar_sesion' %}">Iniciar sesión</a></p></div>
        </form>
    </div>
</body>
</html>
