{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Festival Vallenato{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'prototipo/Styles.css' %}">
</head>
<body>
    <div class="container">
        <header class="header-var">
            <div class="logo"><a href="{% url 'votaciones:inicio' %}"><img src="{% static 'prototipo/img/logo.png' %}" alt="Logo del Festival Vallenato"></a></div>
            <div class="header-title"><h2>Festival Vallenato</h2></div>
            <div class="login-button">
                {% if user.is_authenticated %}
                    <form method="post" action="{% url 'votaciones:cerrar_sesion' %}">{% csrf_token %}<button type="submit">Salir</button></form>
                {% else %}
                    <a href="{% url 'votaciones:iniciar_sesion' %}">Entrar</a>
                {% endif %}
            </div>
        </header>
        {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }} m-3">{{ message }}</div>{% endfor %}
        {% block content %}{% endblock %}
        <footer class="footer-var"><header class="footer-header"><div class="footer-content"><nav class="footer-nav"><ul class="footer-menu">
            <li class="footer-item"><a href="{% url 'votaciones:inicio' %}">Inicio</a></li>
            <li class="footer-item"><a href="{% url 'votaciones:categorias' %}">Categorías</a></li>
            <li class="footer-item"><a href="{% url 'votaciones:categorias' %}">Votaciones</a></li>
        </ul></nav></div></header></footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
